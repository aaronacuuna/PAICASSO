services:
  db:
    image: postgres:16-alpine
    container_name: paicasso_db
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - paicasso_network

  sonardb:
    image: postgres:15-alpine
    container_name: sonardb_container
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - sonardb_data:/var/lib/postgresql/data
    networks:
      - paicasso_network

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube_server
    depends_on:
      sonardb:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonardb:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - paicasso_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paicasso_backend
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      sonarqube:
        condition: service_started
    networks:
      - paicasso_network

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonardb_data:

networks:
  paicasso_network: